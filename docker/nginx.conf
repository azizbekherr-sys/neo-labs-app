server {
    listen __PORT__ default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Keep versioned assets at the browser and CDN edge. Without these headers
    # Cloudflare goes back to the Render origin for every CSS/image request.
    location ~* \.(?:avif|css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:bak|log|sql|zip)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 200s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Deny hidden files except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
